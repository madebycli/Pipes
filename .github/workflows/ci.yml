name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TERM: xterm-256color
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test and build Python package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build "setuptools>=69" wheel
          python -m compileall -q .
          python -m unittest discover -s tests -v
          python pipes_sh.py --help >/dev/null
          python pipes_sh.py --self-test | grep -q '^pipes self-test: PASS$'
          test -s pipes.6
          python -m build --wheel --no-isolation

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Verify lock, check, and build Flake
        run: |
          set -euo pipefail
          nix flake lock
          git diff --exit-code -- flake.lock
          nix flake show --no-write-lock-file
          nix flake check --no-write-lock-file --print-build-logs
          nix build .#pipes --no-write-lock-file --print-build-logs
          ./result/bin/pipes --help >/dev/null
          ./result/bin/pipes --self-test | grep -q '^pipes self-test: PASS$'
          test -f ./result/share/man/man6/pipes.6.gz
      - name: Verify direct GitHub profile install
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIRECT_PROFILE: ${{ runner.temp }}/pipes-profile
        run: |
          set -euo pipefail
          nix profile add --profile "$DIRECT_PROFILE" \
            "github:${GITHUB_REPOSITORY}#pipes"
          test -x "$DIRECT_PROFILE/bin/pipes"
          "$DIRECT_PROFILE/bin/pipes" --self-test | grep -q '^pipes self-test: PASS$'
