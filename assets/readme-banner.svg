<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pipes</title>
  <desc id="desc">Neon terminal pipes weave across a dark grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#031813"/>
      <stop offset="0.52" stop-color="#082b2c"/>
      <stop offset="1" stop-color="#12204b"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72ff9d"/>
      <stop offset="0.5" stop-color="#40e0d0"/>
      <stop offset="1" stop-color="#6e9cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#aaffd2" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <g transform="translate(785 42)" fill="none" stroke="url(#pipe)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 28H148Q176 28 176 56V118Q176 146 204 146H338" stroke-width="25" opacity="0.18" filter="url(#glow)"/>
    <path d="M90 250V214Q90 186 118 186H244Q272 186 272 158V60" stroke-width="25" opacity="0.18" filter="url(#glow)"/>
    <path d="M20 28H148Q176 28 176 56V118Q176 146 204 146H338" stroke-width="10"/>
    <path d="M90 250V214Q90 186 118 186H244Q272 186 272 158V60" stroke-width="10"/>
    <path d="M22 264H48Q76 264 76 236V124Q76 96 104 96H132" stroke-width="10"/>
    <path d="M216 274V240Q216 212 244 212H330" stroke-width="10"/>
    <g fill="#061d1d" stroke-width="7">
      <circle cx="20" cy="28" r="14"/><circle cx="338" cy="146" r="14"/>
      <circle cx="90" cy="250" r="14"/><circle cx="272" cy="60" r="14"/>
      <circle cx="22" cy="264" r="14"/><circle cx="132" cy="96" r="14"/>
      <circle cx="216" cy="274" r="14"/><circle cx="330" cy="212" r="14"/>
    </g>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="82" y="135" fill="#ffffff" font-size="72" font-weight="800" letter-spacing="-2">Pipes</text>
    <text x="86" y="185" fill="#8fffc0" font-size="24" font-weight="700" letter-spacing="2">THE CLASSIC TERMINAL SCREENSAVER, REWIRED</text>
    <text x="86" y="237" fill="#e7fff1" font-size="22">Fast, deterministic, terminal-safe, and delightfully pointless.</text>
    <rect x="86" y="273" width="275" height="6" rx="3" fill="url(#pipe)"/>
  </g>
</svg>
